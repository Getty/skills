apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deployment-replica-demo.rules.example.com
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  validations:
    - expression: "!has(object.spec.replicas) || object.spec.replicas <= 5"
      message: replicas must be at most five in this demonstration scope
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deployment-replica-demo.rules.example.com
spec:
  policyName: deployment-replica-demo.rules.example.com
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        cel-demo: enabled
