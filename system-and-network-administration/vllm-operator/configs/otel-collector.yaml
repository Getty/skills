# LOCAL DIAGNOSTICS ONLY: no TLS/auth/trace storage UI. Do not expose publicly.
# Collector and vLLM must share a host network namespace for localhost to work.
# Verify installed Collector components with: otelcol components
# Validate with: otelcol validate --config=configs/otel-collector.yaml
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
