# Standalone template, not an installer. Replace identities, paths and listeners.
# Both front and back TLS are authenticated. This does not configure client mTLS.
# Loopback listeners are deliberate safe defaults for review/lab use.
worker_processes 1;
events { worker_connections 128; }
http {
    access_log off;
    ssl_protocols TLSv1.2 TLSv1.3;
    server {
        listen 127.0.0.1:8443 ssl;
        server_name api.example.com;
        ssl_certificate /etc/nginx/pki/front.fullchain.pem;
        ssl_certificate_key /etc/nginx/pki/front.key;
        location / {
            proxy_pass https://127.0.0.1:9443;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_server_name on;
            proxy_ssl_name api.internal.example.com;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/pki/internal-roots.pem;
            proxy_ssl_verify_depth 2;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            proxy_set_header Host api.internal.example.com;
            # No unauthenticated original-client certificate claim is forwarded.
            proxy_set_header X-Client-Cert "";
        }
    }
}
