# Include this server block INSIDE nginx's http {} context.
# Local SSE diagnostic proxy only; no internet-facing TLS or tenant auth here.
# Run nginx -t against the effective parent configuration before reloading.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 2m;
    access_log off;

    location ~ ^/v1/(models|chat/completions|completions|embeddings)$ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_ignore_client_abort off;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        add_header X-Accel-Buffering no always;
    }

    # Management, /metrics, /invocations, /sleep, /collective_rpc etc. stay blocked.
    location / { return 404; }
}
