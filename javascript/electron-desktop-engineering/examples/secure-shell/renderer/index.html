<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Constrained desktop bridge</title><link rel="stylesheet" href="./styles.css"></head>
<body><main><h1>Constrained desktop bridge</h1><p>This demonstration keeps preferences in memory. Restarting resets them.</p>
<label for="theme">Theme</label><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
<button id="save" type="button">Apply theme</button><button id="docs" type="button">Open Electron security documentation</button>
<p id="status" role="status" aria-live="polite">Loading preferences…</p></main><script src="./renderer.js" defer></script></body></html>
